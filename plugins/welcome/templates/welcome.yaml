# Отображается для каждого нового участника через services/message_service.py.
# Редактируйте свободно -- изменения в коде не нужны, достаточно
# выполнить `plugin reload welcome`.

title: "✈️ Добро пожаловать на SkyHub Aviation!"
color: 0x2B6CB0

author:
  enabled: true
  name: "SkyHub Aviation"
  avatar: bot

# {name} -- имя участника плейн-текстом (а не упоминание) специально:
# упоминание вида <@id> внутри EMBED'а на телефоне иногда не резолвится
# в имя, если клиент ещё не успел закэшировать нового участника сразу
# после входа (на компьютере это незаметно, там кэш участников грузится
# агрессивнее) -- тогда вместо имени показывается голый "<@ID...>", а по
# тапу выскакивает "нет доступа к этой ссылке". Сам пинг (настоящее
# упоминание, которое реально резолвится на любом клиенте) вынесен в
# обычный текст сообщения ОТДЕЛЬНО от embed'а -- см. plugins/welcome/plugin.py.
description: |
  Привет, {name}! Мы рады видеть тебя на сервере, посвящённом
  авиасимуляторам, авиации, пилотам, диспетчерам и любителям неба.

sections:
  - title: "📖 Правила"
    content:
      - "Прочитайте правила сообщества"
      - "Выберите необходимые роли"
      - "После этого получите доступ ко всем каналам"

  - title: "🗺 Навигация"
    content:
      - "Основные каналы"
      - "Авиасим"
      - "ATC"

footer:
  text: "SkyHub Aviation"
