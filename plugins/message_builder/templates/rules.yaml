# Правила сервера -- отправляется командой `/message_template template:rules`.
# Чтобы отредактировать текст правил, правьте прямо этот файл -- бот
# подхватит изменения при следующей отправке, код трогать не нужно.

title: "📜 Правила сервера SkyHub Aviation"
color: 0x2B6CB0

author:
  enabled: true
  name: "SkyHub Aviation"
  avatar: bot

description: |
  Добро пожаловать на сервер **SkyHub Aviation**! Заходя на сервер, вы
  соглашаетесь соблюдать правила ниже -- их знание не освобождает от
  ответственности за нарушение.

sections:
  - title: "#📌 Правило 1 - Придерживайтесь темы канала"
    content: |
      Перед тем как писать, ознакомьтесь с названием и закреплёнными
      сообщениями канала -- это поможет найти подходящее место для
      обсуждения. Сообщения не по теме канала удаляются без предупреждения.

  - title: "💬 Правило 2 - Уважение к участникам"
    content: |
      Общайтесь вежливо: без оскорблений, травли и провокаций в адрес
      других пилотов, диспетчеров и участников сообщества. Не рассылайте
      спам и не дробите сообщение на десятки отдельных строк подряд.

  - title: "🔞 Правило 3 -- Никакого NSFW и контента 18+"
    content: |
      Любой откровенный, шокирующий или NSFW-контент запрещён полностью,
      без исключений и "шуток" на грани -- это ведёт к немедленному бану.
      Ограничение действует и на имя, статус и аватар вашего профиля.

  - title: "📢 Правило 4 -- Без самопиара и рекламы"
    content: |
      Продвигать личные проекты (стримы, серверы, каналы) можно только в
      отведённых для этого каналах и с разумной частотой. Массовые личные
      сообщения с рекламой другим участникам запрещены.

  - title: "🛫 Правило 5 -- Достоверность авиационной информации"
    content: |
      Не публикуйте выдуманные METAR/TAF/NOTAM и не выдавайте недостоверные
      данные за официальные. Ролевые ATC/пилотные активности -- только в
      отведённых для этого каналах, чтобы не вводить в заблуждение новичков.

  - title: "🎭 Правило 6 -- Не выдавайте себя за администрацию"
    content: |
      Представляться модератором, администратором или официальным лицом,
      не имея этой роли, запрещено. По любым вопросам к модерации
      обращайтесь напрямую к участникам с ролью **Модератор**/**Admin**.

  - title: "©️ Правило 7 -- Уважайте авторские права"
    content: |
      Публикуя чужие материалы, указывайте автора/источник. Репосты без
      разрешения оригинального автора и материалы без указания источника
      удаляются.

  - title: "⚖️ Правило 8 -- Соблюдайте общие правила Discord"
    content: |
      Торговля аккаунтами, читы, эксплойты и прочие нарушения
      [Условий использования Discord](https://discord.com/terms) здесь
      также запрещены и являются основанием для бана.

footer:
  text: "SkyHub Aviation -- нарушение правил рассматривается модерацией индивидуально"
