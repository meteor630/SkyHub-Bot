# Правила сервера -- отправляется командой `/message_template template:rules`.
# Чтобы отредактировать текст правил, правьте прямо этот файл -- бот
# подхватит изменения при следующей отправке, код трогать не нужно.
#
# У каждого раздела можно задать:
#   heading: 0 (по умолчанию, жирным, как обычный подзаголовок)
#             1 -> # самый крупный заголовок
#             2 -> ## средний
#             3 -> ### мелкий
#   blockquote: true -- вложенная цитата (тонкая ВНУТРЕННЯЯ полоска
#          внутри той же карточки, что и весь текст -- как на скриншотах
#          у крупных ботов). Цвет всегда серый -- это ограничение
#          Discord, у вложенной цитаты своего цвета не бывает.
#   color: 0xRRGGBB -- если нужен ИМЕННО свой цвет у сноски, а не серый --
#          раздел тогда рисуется ОТДЕЛЬНОЙ карточкой (отдельным embed'ом)
#          со своей полоской слева, отдельно от основной. Внутри одной
#          карточки Discord красить что-либо в разные цвета не даёт.
#   content: список строк через "- " -- каждая строка станет пунктом
#          перечисления с точкой "•" (см. пример в правиле 4 ниже).
#   marker/sub_marker: маркер верхнего уровня/вложенных пунктов -- те же
#          4 варианта, что в "Библиотеке маркеров" Word:
#          bullet (•, по умолчанию сверху) / circle (◦, по умолчанию у
#          вложенных) / square (▪) / none (без маркера). Чтобы у пункта
#          списка появились СВОИ вложенные подпункты (с отступом и, по
#          умолчанию, пустым кружком) -- вместо простой строки укажите
#          {text: "...", items: ["...", "..."]} (пример -- правило 4).

title: "📜 Правила сервера SkyHub Aviation"
color: 0x2B6CB0

author:
  enabled: true
  name: "SkyHub Aviation"
  avatar: bot

description: |
  Мы рады видеть вас в нашем сообществе! Убедитесь, что вы уже ознакомились с правилами нашего сервера. Ваше вступление на сервер подтверждает, что вы принимаете правила нашего сообщества.

sections:
  - title: "📌 Правило 1 - Придерживайтесь темы канала"
    heading: 0
    content: |
      Пожалуйста, ознакомьтесь с описаниями каналов и закрепленными сообщениями. Это поможет вам найти наиболее подходящие места для определённых обсуждений. Сообщения и контент, которые не соответствуют теме канала, подлежат удалению!

  - title: "💖 Правило 2: Будьте доброжелательны к другим пользователям!"
    heading: 3
    content: |
      Не рассылайте спам и не наводняйте обсуждения большим количеством отдельных сообщений подряд. К этому также относятся: сообщения из отдельных друг от друга букв и слов, изображений, объем текстов в одном или нескольких каналах. Не забывайте, что на сервере есть и другие Путешественники, и мы должны относится друг к другу с уважением.
      Чтобы обеспечить соблюдение наших правил, некоторые ссылки занесены в черный список. 
      А. Не рассылайте нежелательные личные сообщения другим пользователям.
      Б. Реклама, которая нацелена на ваш личный рост, а не общее развитие нашего сообщества, строго запрещена. Однако, если вы все же хотите поделиться своим проектом с другими, делайте это с разумной частотой в соответствующих медиа-каналах..

  - title: "🛡️ Правило 3: Относитесь с уважением к другим пользователям!"
    heading: 3
    content: |
      Мат, оскорбления, домогательства, агрессивное и провокационное поведение по отношению к другим людям строго запрещены. Также запрещены оскорбительные сообщения, которые содержат в себе: угрожающий, непристойный, дискредитирующий, снисходительный, клеветнический, расовый, религиозный, политический, сексуально неприемлемый или фиктивный, сфабрикованный контент, а также плагиат. Не пытайтесь содействовать обсуждениям, которые разделяют наше сообщество.
      А. Контент, который влияет на использование Discord другими людьми, включая, помимо прочего: травлю, запугивание, дезинформацию и отклонение от первоначальной темы обсуждения, подлежит удалению.
      Б. Комментируя чужой творческий контент, убедитесь, что ваша критика разумна и конструктивна. Враждебные и иррациональные высказывания не приветствуются в нашем сообществе..

  # Пример списка с вложенными подпунктами -- маркер верхнего уровня "•"
  # (по умолчанию), у вложенных -- пустой кружок "◦" (тоже по умолчанию).
  # Ровно та структура, что в "Правило 4 -> А./Б." со скриншота.
  - title: "⚔️ Правило 4: Поддерживайте чистоту нашего сервера!"
    heading: 3
    content: |
      - "Распространение материалов порнографического/NSFW/оскорбительного/шокирующего содержания строго запрещено!  Вдобавок к тому, что указано в Правиле 3, воздержитесь от публикации материалов следующего характера: хентай, гуро, шокирующие материалы и т.п. В нашем сообществе также существует политика НУЛЕВОЙ терпимости к сексуализации несовершеннолетних персонажей/людей"
      - text: "Чтобы обеспечить соблюдение правил, некоторые ссылки занесены в чёрный список."
        items:
          - "**А.** А. Любая форма контента, от текста до медиа, которая иллюстрирует или предлагает нормализацию/оправдание сексуализации несовершеннолетних, приведет к немедленному запрету без возможности на апелляцию. Здесь нет места таким «шуткам», как «легальные лоли» и т.п."
          - "**Б.** Имена, статусы и аватарки вашего профиля Discord также регулируются нашими правилами."
          - "**В.** Если хотите узнать, какой контент в нашем сообществе является NSFW, перейдите в раздел ⁠правила-постинга."

  - title: "⚖️ Правило 5: Не пытайтесь быть «модератором без полномочий» и не выдавайте себя за другую личность!"
    heading: 3
    content: |
      Выдавать себя за @MOD или @Staff строго запрещено! Если вы хотите пожаловаться на опубликованный контент другим пользователем в нашем сообществе, не стесняйтесь обращаться в @Contact Mods!

  # Пример вложенной цитаты -- тонкая полоска ВНУТРИ этой же карточки
  # (общий синий цвет остаётся один на всё сообщение), ровно как сноска
  # на скриншоте. Если бы вместо blockquote был задан color -- получилась
  # бы отдельная карточка своего цвета, а не вложенная в эту же.

  - title: ""
    blockquote: true
    content: |
      Канал ⁠связь-с-модераторами также содержит инструкции по обращению за помощью модераторов. В экстренных случаях вы можете упомянуть роль @MOD в соответствующем канале.

  - title: "🎨 Правило 6: Уважайте авторские права других пользователей!"
    heading: 3
    content: |
      Если вы используете чужие материалы, будьте добры оставлять ссылку на оригинал. Репосты, которые не были разрешены автором оригинала, подлежат удалению. Ссылки на сторонние сайты, где сложно идентифицировать авторство, не принимаются. Если платформу/имя автора оригинала не удается найти, воздержитесь от публикации.
 
  - title: "📑 Правило 7: Соблюдайте Условия обслуживания"
    heading: 3
    content: |
      Нарушения Условий обслуживания недопустимы: продажа/покупка/обмен учетных записей, мошенничество, взломы и эксплойты. NDA контент, datamines, утечки и модификация/редактирование файлов игры запрещены к обсуждению и распространению. Вы можете отслеживать официальные новости об игре на верифицированных площадках Genshin Impact ⁠social-media-links.
      А. Обсуждения официально анонсированного контента разрешены, но обсуждения, основанные на утечках, строго запрещены. Фан-арт, основанный на утечках, также недопустим к публикации.
      Б. Утечки из других продуктов HoYoverse также запрещены в нашем сообществе. Например: Honkai Impact 3rd, Tears of Themis, Honkai: Star Rail, и Zenless Zone Zero.
      В. В ⁠превью-персонажей и ⁠обзор-персонажей вы можете узнать новую информацию о будущих анонсах!

  - title: "⚖️ Правило 8 - Соблюдайте общие правила Discord"
    heading: 3
    content: |
      Торговля аккаунтами, читы, эксплойты и прочие нарушения
      [Условий использования Discord](https://discord.com/terms) здесь
      также запрещены и являются основанием для бана.

footer:
  text: "SkyHub Aviation -- нарушение правил рассматривается модерацией индивидуально"
