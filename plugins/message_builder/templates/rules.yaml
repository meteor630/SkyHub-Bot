# Правила сервера -- отправляется командой `/message_template template:rules`.
# Чтобы отредактировать текст правил, правьте прямо этот файл -- бот
# подхватит изменения при следующей отправке, код трогать не нужно.
#
# У каждого раздела можно задать:
#   heading: 0 (по умолчанию, жирным, как обычный подзаголовок)
#             1 -> # самый крупный заголовок
#             2 -> ## средний
#             3 -> ### мелкий
#   blockquote: true -- вложенная цитата (тонкая ВНУТРЕННЯЯ полоска
#          внутри той же карточки, что и весь текст -- как на скриншотах
#          у крупных ботов). Цвет всегда серый -- это ограничение
#          Discord, у вложенной цитаты своего цвета не бывает.
#   color: 0xRRGGBB -- если нужен ИМЕННО свой цвет у сноски, а не серый --
#          раздел тогда рисуется ОТДЕЛЬНОЙ карточкой (отдельным embed'ом)
#          со своей полоской слева, отдельно от основной. Внутри одной
#          карточки Discord красить что-либо в разные цвета не даёт.
#   content: список пунктов -- каждый рендерится НАСТОЯЩИМ markdown-
#          списком Discord ("- пункт"), точку рисует сам Discord (не наш
#          текстовый символ), поэтому и крупнее, и перенос длинной
#          строки внутри пункта идёт с отступом сам по себе.
#          У пункта можно сделать СВОИ вложенные подпункты (второй
#          уровень, "А./Б./В.") -- вместо простой строки укажите
#          {text: "...", items: ["...", "..."]}, см. правило 2 ниже.
#          Перенос строки ВНУТРИ одного пункта (вторая строка ТОГО ЖЕ
#          пункта, а не новый пункт списка) -- вставьте "\n" прямо в
#          текст пункта, например: "Первая часть.\nВторая часть."
#   marker: bullet (по умолчанию, настоящий список "- ") / none (совсем
#          без маркеров, просто строки друг под другом). Форму точки у
#          вложенного уровня (обычно пустой кружок вместо кружка)
#          выбирает сам Discord -- это его отрисовка вложенности,
#          настроить её конкретной формой (кружок/квадрат) нельзя.
#   new_card: true -- начать с ЭТОГО раздела новую карточку (embed) в
#          том же сообщении, БЕЗ смены цвета -- просто чтобы разбить
#          одно длинное сообщение на несколько отдельных блоков подряд,
#          как у крупных ботов (см. правило 6 ниже). Если ещё и нужен
#          свой цвет у новой карточки -- добавьте color рядом.

title: "📜 Правила сервера SkyHub Aviation"
color: 0x2B6CB0

author:
  enabled: true
  name: "SkyHub Aviation"
  avatar: bot

description: |
  Мы рады видеть вас в нашем сообществе! Убедитесь, что вы уже
  ознакомились с правилами нашего сервера - вступление на сервер
  подтверждает, что вы их принимаете.

sections:
  - title: "📌 Правило 1 - Придерживайтесь темы канала"
    heading: 3
    content:
      - "Ознакомьтесь с названием и закреплёнными сообщениями канала, прежде чем писать - это поможет найти подходящее место для обсуждения. Сообщения не по теме канала удаляются без предупреждения."

  - title: "💖 Правило 2 - Уважение к участникам, без спама"
    heading: 3
    content:
      - "Не рассылайте спам и не наводняйте обсуждения большим количеством отдельных сообщений подряд - сюда же относится дробление одной мысли на десятки строк. На сервере много других участников, относитесь друг к другу с уважением."
      - text: "Чтобы обеспечить соблюдение правил, некоторые виды ссылок и сообщений занесены в чёрный список:"
        items:
          - "**А.** Не рассылайте нежелательные личные сообщения другим участникам."
          - "**Б.** Реклама, нацеленная на ваш личный рост, а не на общее развитие сообщества, запрещена. Поделиться своим проектом можно с разумной частотой и только в отведённых для этого каналах."

  - title: "🛡️ Правило 3 - Никаких оскорблений и травли"
    heading: 3
    content:
      - "Мат, оскорбления, домогательства, агрессивное и провокационное поведение по отношению к другим участникам строго запрещены - как и угрожающий, непристойный, дискредитирующий, расистский или иным образом неприемлемый контент."
      - text: "Дополнительно:"
        items:
          - "**А.** Контент, мешающий нормальному общению на сервере (травля, запугивание, намеренная дезинформация, уводящий от темы флуд), удаляется."
          - "**Б.** Критика чужого творчества должна быть разумной и конструктивной - враждебные и иррациональные высказывания не приветствуются."

  - title: "⚔️ Правило 4 - Никакого NSFW и контента 18+"
    heading: 3
    content:
      - "Публикация порнографического, шокирующего или иным образом оскорбительного контента строго запрещена. Действует политика нулевой терпимости к сексуализации несовершеннолетних персонажей или людей в любой форме - без исключений и «шуток на грани»."
      - text: "Дополнительно:"
        items:
          - "**А.** Нарушение этого правила ведёт к немедленному и окончательному бану без права на апелляцию."
          - "**Б.** Ограничение действует и на имя, статус и аватар вашего профиля Discord."
          - "**В.** Полный список того, что считается NSFW на этом сервере - в правилах постинга."

  - title: "⚖️ Правило 5 - Не выдавайте себя за модерацию"
    heading: 3
    content:
      - "Представляться модератором, администратором или иным официальным лицом, не имея этой роли, запрещено. По вопросам к модерации обращайтесь напрямую к участникам с соответствующей ролью."

  # Вложенная цитата -- тонкая полоска ВНУТРИ этой же карточки (общий
  # синий цвет остаётся один на всё сообщение), не отдельная "сноска".
  - title: "💡 Как связаться с модерацией"
    blockquote: true
    content: |
      Канал `#связь-с-модераторами` содержит инструкции по обращению за
      помощью. В экстренных случаях вы можете упомянуть роль модерации в соответствующем канале.

  # new_card -- дальше идёт новая карточка тем же сообщением (без смены
  # цвета), чтобы длинный список правил не смотрелся одной "простынёй".
  - title: "🎨 Правило 6 - Уважайте авторские права"
    heading: 3
    new_card: true
    content:
      - "Используя чужие материалы, указывайте автора/источник. Репосты без разрешения оригинального автора и материалы без указания источника удаляются - если источник установить не удалось, воздержитесь от публикации."

  - title: "📑 Правило 7 - Соблюдайте условия использования Discord"
    heading: 3
    content:
      - "Торговля аккаунтами, читы, эксплойты, мошенничество и взломы запрещены и являются основанием для бана."
      - text: "Дополнительно:"
        items:
          - "**А.** Обход или подделка систем проверки/верификации сервера запрещены."
          - "**Б.** Публикация приватных данных других участников без их согласия запрещена."
          - "**В.** Все действия на сервере также регулируются [Условиями использования Discord](https://discord.com/terms)."

footer:
  text: "SkyHub Aviation -- нарушение правил рассматривается модерацией индивидуально"
