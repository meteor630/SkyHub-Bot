# Универсальный шаблон "красивого" объявления --
# `/message_template template:announcement`.
#
# Это ЗАГОТОВКА: перед конкретным анонсом попросите меня подставить
# реальные детали (или отредактируйте текст ниже сами) -- шаблон
# отправляется как есть, без подстановки параметров на лету.

title: "📢 Объявление"
color: 0xF1C40F

author:
  enabled: true
  name: "SkyHub Aviation"
  avatar: bot

description: |
  Коротко опишите суть объявления одним-двумя предложениями здесь --
  это первое, что увидят участники.

sections:
  - title: "🗓 Когда"
    content: "Дата и время (по UTC)"

  - title: "📍 Где"
    content: "Канал/сервер/ссылка, если применимо"

  - title: "ℹ️ Подробности"
    content:
      - "Первый важный пункт"
      - "Второй важный пункт"
      - "Третий важный пункт"

footer:
  text: "SkyHub Aviation"
