# Универсальный шаблон "красивого" объявления --
# `/message_template template:announcement`.
#
# Это ЗАГОТОВКА: перед конкретным анонсом попросите меня подставить
# реальные детали (или отредактируйте текст ниже сами) -- шаблон
# отправляется как есть, без подстановки параметров на лету.
#
# У каждого раздела можно задать:
#   heading: 0 (по умолчанию, жирным) / 1 (# крупный) / 2 (## средний) / 3 (### мелкий)
#   color: 0xRRGGBB -- рисует раздел отдельной цветной врезкой-сноской

title: "📢 Объявление"
color: 0xF1C40F

author:
  enabled: true
  name: "SkyHub Aviation"
  avatar: bot

description: |
  Коротко опишите суть объявления одним-двумя предложениями здесь --
  это первое, что увидят участники.

sections:
  - title: "🗓 Когда"
    heading: 2
    content: "Дата и время (по UTC)"

  - title: "📍 Где"
    heading: 2
    content: "Канал/сервер/ссылка, если применимо"

  - title: "ℹ️ Подробности"
    heading: 2
    content:
      - "Первый важный пункт"
      - "Второй важный пункт"
      - "Третий важный пункт"

  # Пример цветной врезки -- удалите, если не нужна для конкретного анонса.
  - title: "⚠️ Важно"
    color: 0xE74C3C
    content: "Сюда -- то, что должно бросаться в глаза отдельно от основного текста."

footer:
  text: "SkyHub Aviation"
